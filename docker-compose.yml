services:
  react-app:
    build:
      context: ./react-app
    container_name: react-app-dev
    ports:
      - "3001:5173"
    volumes:
      - ./react-app:/app
      - react_node_modules:/app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
    networks:
      - app-network

  next-app:
    build:
      context: ./next-app
    container_name: next-app-dev
    ports:
      - "3002:3000"
    volumes:
      - ./next-app:/app
      - next_node_modules:/app/node_modules
      - next_build:/app/.next
    environment:
      WATCHPACK_POLLING: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    networks:
      - app-network

  express-api:
    build:
      context: ./express-api
    container_name: express-api-dev
    ports:
      - "5001:5000"
    volumes:
      - ./express-api:/app
      - express_node_modules:/app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  react_node_modules:
  next_node_modules:
  next_build:
  express_node_modules:
